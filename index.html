<!DOCTYPE html>
<html data-theme="light">
 <head>
     <title> World Cup Quiz</title>
     <script src="script.js" defer></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.classless.min.css">
        <link rel="stylesheet" href="css/container.css">
        <link rel="stylesheet" href="css/card.css">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/choice-list.css">
        <link rel="stylesheet" href="css/scoreboard.css">
        <link rel="stylesheet" href="css/banner.css">
        <link rel="stylesheet" href="css/hero.css">
        <link rel="stylesheet" href="css/result-box.css">
        <link rel="stylesheet" href="css/flex-box.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
     
 </head>
   <body id="my-body">
         <div id="start-quiz-banner" class="banner">Challenge your FIFA World Cup knowledge and see how high you can score!</div>
       <a id="about-1" href="about.html">About</a>
     <div class="flex-row">
      <div class="card" id="card-1">
         <div class="hero">
            <h1 id="headline-1"> FIFA World Cup Quiz </h1>
            <p id="date-time"></p>
         </div>
        
        <!-- QUESTION 1 -->
            <h2 id="headline-2">Question 1 </h2>
             <p  id="tagline-2">Which country won the 2026 World Cup?</p>
        
          <div class="choice-list" id="Btn-1">
            <button type="button" class="btn btn-success"  id="b1">England</button>
             <button type="button" class="btn btn-success" id="b2">Argentina</button>
            <button type="button" class="btn btn-success"  id="b3">Spain</button>
          </div>
     </div>
        <!-- QUESTION 2 -->
       <div class="card" id="card-2">
                <h2 id="headline-3">Question 2</h2>
                <p id="tagline-3">Which country has won the most World Cup ?</p>
                <div class="choice-list">
                 <button type="button" class="btn btn-success" id="b4">Germany</button>
                 <button type="button" class="btn btn-success" id="b5">Brazil</button>
                 <button type="button" class="btn btn-success" id="b6">France</button>
                 </div>
         </div>
         
      <!-- QUESTION 3 -->
        <div class="card" id="card-3">
                <h2 id="headline-4">Question 3</h2>
                <p id="tagline-3">Which country hosted the 2022 World cup?</p>
                <div class="choice-list">
                 <button type="button" class="btn btn-success" id="b7">Qatar</button>
                 <button type="button" class="btn btn-success" id="b8">Russia</button>
                 <button type="button" class="btn btn-success" id="b9">Brazil</button>
                 </div>
        </div>

          

           <div >
              <img id="winner-1"  alt="world champion" src="spain.jpg" hidden>
           </div>
          <div >
              <img id="winner-2"  alt="world champion" src="brazil.jpg" hidden>
           </div>
        <div id="result-1" class="result-box" hidden>    
            <p id="ans"><b>Answer</b></p>
            <p id="score-1" class="scoreboard"><b>Your Score</b></p>
            <button id="tryBtn-1" type="button">Start Over</button>
         </div>
    </div>
      <footer class="footer-class">
         <p id="footer-headline">How many visitors</p>
      </footer>
       
    </body>
     
</html>
